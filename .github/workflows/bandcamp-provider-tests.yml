name: Bandcamp Provider Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */7 * *' # At 00:00 on every 7th day-of-month.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

    # Cache apt .deb files to speed up ffmpeg installation (in home to avoid permission issues).
    - name: Cache apt packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/apt-packages
        key: apt-ffmpeg-${{ runner.os }}

    - name: Install ffmpeg
      run: |
        # Restore cached .deb files to apt cache (if any)
        sudo cp ~/.cache/apt-packages/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        sudo apt-get update && sudo apt-get install -y ffmpeg
        # Save .deb files for next run
        mkdir -p ~/.cache/apt-packages && cp /var/cache/apt/archives/*.deb ~/.cache/apt-packages/ 2>/dev/null || true

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        repository: 'music-assistant/server'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python
      run: |
        uv sync --extra test
        uv pip install -r requirements_all.txt

    - name: Run Bandcamp provider tests
      run: uv run pytest tests/providers/bandcamp

    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v8
      with:
        script: |
          const issue = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Bandcamp Provider Tests Failed',
            body: 'The Bandcamp provider tests have failed. Please investigate.'
          };
          await github.rest.issues.create(issue);
